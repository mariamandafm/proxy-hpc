[metadata]
name = cuidapp
version = file:VERSION
description = Core AAI CUID app
license = Apache License Version 2.0
requires_dist = setuptools

[options]
include_package_data = True
package_dir =
    = src
packages = find:
install_requires =
    fastapi
    starlette
    SQLAlchemy
    python-dotenv
    click
    alembic
[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    cuidapp-db = db_migration.command:cli
