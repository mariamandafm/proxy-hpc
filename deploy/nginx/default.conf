# Certificado e chave: caminhos no host definidos por SSL_CERT_PATH e SSL_KEY_PATH
# no .env, montados em /etc/nginx/ssl/ pelo docker-compose.yaml.
server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://satosa:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # O cookie de estado do SATOSA (Set-Cookie) passa do buffer padrão de 4k,
        # o que causaria "502 upstream sent too big header".
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
    }
}
